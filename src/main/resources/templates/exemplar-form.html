<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Exemplar</title>
    <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/filmes.css"/>
</head>
<body>
<div class="container container-padrao">
    <h2>Novo(s) Exemplar(es)</h2>

    <form th:action="@{/exemplares/salvar-multiplos}" method="post" th:object="${exemplar}">
        <div class="form-group">
            <label>Filme</label>
            <div th:if="${filmeBloqueado != null and filmeBloqueado}">
                <input type="hidden" name="filme.id" th:value="*{filme.id}"/>
                <input type="text" class="form-control" th:value="*{filme.titulo}" readonly/>
            </div>
            <div th:if="${filmeBloqueado == null or !filmeBloqueado}">
                <select class="form-control" name="filme.id" required>
                    <option disabled selected value="">Selecione um filme</option>
                    <option th:each="f : ${filmes}" th:value="${f.id}" th:text="${f.titulo}"
                            th:selected="*{filme != null} and ${f.id} == *{filme.id}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Quantidade de Exemplares</label>
            <input type="number" name="quantidade" min="1" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Data de Cadastro</label>
            <input type="date" th:field="*{dataCadastro}" class="form-control"/>
        </div>

        <div class="form-check">
            <input type="checkbox" th:field="*{ativo}" class="form-check-input" id="ativo"/>
            <label class="form-check-label" for="ativo">Ativo</label>
        </div>

        <div class="btn-grupo">
            <button type="submit" class="btn btn-success">Salvar Exemplares</button>
            <a th:href="@{/filmes}" class="btn btn-secondary">Cancelar</a>
        </div>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    </form>
</div>
</body>
</html>
