<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Filme</title>
    <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/dist/css/adminlte.min.css"/>
</head>
<body class="hold-transition sidebar-mini">
<div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
<div class="wrapper container mt-4">
    <section class="content">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Editar Filme</h3>
            </div>
            <form th:action="@{/filmes/editar}" method="post" th:object="${filme}">
                <div class="card-body">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="form-group">
                        <label>Título</label>
                        <input class="form-control" type="text" th:value="*{titulo}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Resumo</label>
                        <textarea class="form-control" rows="3" th:text="*{resumo}" readonly></textarea>
                    </div>
                    <div class="form-group">
                        <label>Data de Lançamento</label>
                        <input class="form-control" th:value="*{lancamento}" readonly/>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{ativo}" id="ativo">
                        <label class="form-check-label" for="ativo">Ativo</label>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                    <a th:href="@{/filmes}" class="btn btn-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </section>
</div>
<script src="/plugins/jquery/jquery.min.js"></script>
<script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/dist/js/adminlte.min.js"></script>
</body>
</html>
