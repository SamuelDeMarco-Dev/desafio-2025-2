<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Filme</title>
    <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/filmes.css"/>
</head>
<body>
<div class="container container-padrao">
    <h2>Editar Filme</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/filmes/editar}" method="post" th:object="${filme}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Título</label>
            <input type="text" class="form-control" th:value="*{titulo}" readonly>
        </div>

        <div class="form-group">
            <label>Resumo</label>
            <textarea class="form-control justificar" rows="3" th:text="*{resumo}" readonly></textarea>
        </div>

        <div class="form-group">
            <label>Data de Lançamento</label>
            <input class="form-control" th:value="*{lancamento}" readonly>
        </div>

        <div class="form-check">
            <input type="checkbox" class="form-check-input" th:field="*{ativo}" id="ativo">
            <label class="form-check-label" for="ativo">Ativo</label>
        </div>

        <div class="btn-grupo">
            <button type="submit" class="btn btn-success">Salvar Alterações</button>
            <a th:href="@{/filmes}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</div>

</body>
</html>
