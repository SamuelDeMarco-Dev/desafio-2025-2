<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Filme</title>
  <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
  <h2>Cadastro de Filme</h2>

  <form th:action="@{/filmes/buscar-api}" method="post" class="form-inline mb-3">
    <div class="form-group mr-2">
      <label for="titulo" class="mr-2">Buscar Filme:</label>
      <input type="text" class="form-control" id="titulo" name="titulo" required placeholder="Digite o nome do filme">
    </div>
    <button type="submit" class="btn btn-primary">Buscar</button>
  </form>

  <div th:if="${erro != null}" class="alert alert-danger" th:text="${erro}"></div>

  <div th:if="${filme != null}">
    <form th:action="@{/filmes/salvar}" method="post">
      <input type="hidden" th:name="titulo" th:value="${filme.titulo}"/>
      <input type="hidden" th:name="resumo" th:value="${filme.resumo}"/>
      <input type="hidden" th:name="pontuacao" th:value="${filme.pontuacao}"/>
      <input type="hidden" th:name="lancamento" th:value="${filme.lancamento}"/>

      <div class="form-group">
        <label>Filme Encontrado:</label>
        <p><strong th:text="${filme.titulo}"></strong> - <em th:text="${filme.resumo}"></em></p>
      </div>

      <div class="form-check">
        <input type="checkbox" class="form-check-input" name="ativo" id="ativo" checked>
        <label class="form-check-label" for="ativo">Ativo</label>
      </div>

      <div class="form-group mt-2">
        <label for="exemplaresDisponiveis">Exemplares Disponíveis:</label>
        <input type="number" class="form-control" name="exemplaresDisponiveis" min="0" value="0">
      </div>

      <button type="submit" class="btn btn-success">Salvar Filme</button>
    </form>
  </div>
</div>
</body>
</html>
