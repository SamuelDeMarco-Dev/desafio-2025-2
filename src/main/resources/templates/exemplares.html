<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exemplares do Filme</title>
    <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/filmes.css"/>
</head>
<body>
<div class="container container-padrao">
    <h2>
        Exemplares do Filme:
        <span th:text="${filme.titulo}"></span>
        <small class="text-muted">(Disponíveis: <span th:text="${filme.exemplaresDisponiveis}"></span>)</small>
    </h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Data de Cadastro</th>
            <th>Ativo</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="exemplar : ${exemplares}">
            <td th:text="${exemplar.id}">1</td>
            <td th:text="${exemplar.dataCadastro}"></td>
            <td>
          <span class="badge" th:classappend="${exemplar.ativo} ? 'badge-success' : 'badge-danger'"
                th:text="${exemplar.ativo} ? 'Sim' : 'Não'"></span>
            </td>
            <td>
                <form th:action="@{'/exemplares/inativar/' + ${exemplar.id}}" method="post" th:if="${exemplar.ativo}">
                    <input type="hidden" name="filmeId" th:value="${filme.id}"/>
                    <button type="submit" class="btn btn-sm btn-danger">Inativar</button>
                </form>
                <form th:action="@{'/exemplares/reativar/' + ${exemplar.id}}" method="post" th:if="${!exemplar.ativo}">
                    <input type="hidden" name="filmeId" th:value="${filme.id}"/>
                    <button type="submit" class="btn btn-sm btn-success">Reativar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="btn-grupo">
        <a th:href="@{'/exemplares/novo?filmeId=' + ${filme.id}}" class="btn btn-primary">Cadastrar Exemplar</a>
        <a th:href="@{/filmes}" class="btn btn-secondary">Voltar</a>
    </div>
</div>

</body>
</html>
